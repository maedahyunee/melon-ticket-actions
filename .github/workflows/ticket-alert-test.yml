name: Ticket Alert Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Send Slack Test
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          curl --fail --silent --show-error \
            -X POST \
            -H "Content-Type: application/json" \
            --data '{"text":"NCT WISH 티켓 알림 시스템 테스트 💚"}' \
            "$SLACK_WEBHOOK_URL"
